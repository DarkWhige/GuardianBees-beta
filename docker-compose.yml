services:
  guardianbees:
    build:
      context: .
    container_name: guardianbees
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-}
      TRAFFIC_LOG_PATH: /app/data/traffic.jsonl
    volumes:
      - ./data:/app/data
    restart: unless-stopped